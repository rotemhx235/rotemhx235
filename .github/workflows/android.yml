name: Build APK

# Builds an installable APK on every push. GitHub's runners already have the
# Android SDK, so nobody needs a local toolchain to get a testable build.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # A recognisable filename, so what lands in the phone's Downloads folder
      # is obviously this app and not "app-debug".
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gadol.apk

      - name: Upload APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: gadol-debug-apk
          path: gadol.apk
          if-no-files-found: error

      # Artifacts can only be downloaded by a signed-in GitHub user, which is a
      # poor fit for installing on a phone. The release below is a plain public
      # link that works in any mobile browser, and always points at the newest
      # build of the branch.
      - name: Publish latest build as a downloadable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/text-magnification-accessibility-app-2iuwxo'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: גדול — הגרסה האחרונה
          body: |
            הגרסה האחרונה של האפליקציה, נבנתה אוטומטית מהקוד העדכני.

            **להתקנה:** להוריד את `gadol.apk` למטה וללחוץ עליו בטלפון.
            הוראות מלאות נמצאות ב-[README](https://github.com/rotemhx235/rotemhx235#איך-מתקינים-על-הטלפון).

            גרסת קוד: ${{ github.sha }}
          prerelease: true
          files: gadol.apk
          fail_on_unmatched_files: true
